<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Gerador de Currículo</title>
</head>
<body>
    <h1>Gerador de Currículos</h1>
    <form action="gerar_curriculo.php" method="post">
        <p class="aviso"><span class="obrigatorio">*</span> campo obrigatório</p>

        <fieldset class="personal-info">
            <legend>Dados Pessoais</legend>

            <div class="campo">
                <label for="nome">Nome completo <span class="obrigatorio">*</span></label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="campo">
                <label for="cidade">Cidade <span class="obrigatorio">*</span></label>
                <input type="text" id="cidade" name="cidade" required>
            </div>
            <div class="campo">
                <label for="telefone">Número de telefone <span class="obrigatorio">*</span></label>
                <input type="text" id="telefone" name="telefone" placeholder="Ex: (11) 91234-5678" required>
            </div>
            <div class="campo">
                <label for="email">E-mail <span class="obrigatorio">*</span></label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="campo">
                <label for="nascimento">Data de nascimento <span class="obrigatorio">*</span></label>
                <input type="date" id="nascimento" name="nascimento" required>
            </div>
            <div class="campo">
                <label for="nacionalidade">Nacionalidade <span class="obrigatorio">*</span></label>
                <input type="text" id="nacionalidade" name="nacionalidade" required>
            </div>
        </fieldset>

        <fieldset class="formation">
            <legend>Formação Acadêmica</legend>

            <div class="campo">
                <label for="cursos">Curso</label>
                <textarea id="cursos" name="cursos"></textarea>
            </div>
            <div class="campo">
                <span class="rotulo">Status</span>
                <div class="opcoes">
                    <label class="opcao"><input type="radio" id="status_Cursando" name="status" value="Cursando"> Cursando</label>
                    <label class="opcao"><input type="radio" id="status_Concluído" name="status" value="Concluído"> Concluído</label>
                </div>
            </div>
            <div class="campo">
                <label for="ano_conclusao">Ano de conclusão</label>
                <input type="number" id="ano_conclusao" name="ano_conclusao" placeholder="Ex: 2024">
            </div>
        </fieldset>

        <fieldset class="habilities">
            <legend>Habilidades</legend>

            <div id="habilidades_container">
                <label for="habilidades">Descreva suas habilidades</label>
                <textarea id="habilidades" name="habilidades[]" placeholder="Descreva uma habilidade"></textarea>
            </div>
            <button type="button" class="add-button" id="adicionar_habilidades">+ Adicionar habilidade</button>

            <div class="campo">
                <label for="idiomas">Idiomas</label>
                <textarea id="idiomas" name="idiomas"></textarea>
            </div>
        </fieldset>

        <fieldset class="experience">
            <legend>Experiência Profissional</legend>

            <div id="experiencias_container">
                <div class="experience-item">
                    <div class="campo">
                        <label for="experiencia">Trabalho</label>
                        <textarea id="experiencia" name="experiencia[]"></textarea>
                    </div>
                    <div class="campo">
                        <span class="rotulo">Status</span>
                        <div class="opcoes">
                            <label class="opcao"><input type="radio" id="status_atual" name="status_experiencia[0]" value="atual"> Trabalho atual</label>
                            <label class="opcao"><input type="radio" id="status_anterior" name="status_experiencia[0]" value="anterior"> Trabalho anterior</label>
                        </div>
                    </div>
                    <div class="linha">
                        <div class="campo">
                            <label for="ano_inicio">Ano de início</label>
                            <input type="number" id="ano_inicio" name="ano_inicio[]" placeholder="Ex: 2020">
                        </div>
                        <div class="campo">
                            <label for="ano_fim">Ano de fim</label>
                            <input type="number" id="ano_fim" name="ano_fim[]" placeholder="Ex: 2023">
                        </div>
                    </div>
                </div>
            </div>
            <button type="button" class="add-button" id="adicionar_experiencia">+ Adicionar experiência</button>
        </fieldset>

        <input type="submit" value="Gerar Currículo">
    </form>
    <script src="app.js"></script>
</body>
</html>
